name: Feature request
description: Suggest something HubPilot could do better
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Start with the real use case.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What should HubPilot do?
      description: Describe the behavior you would want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else you tried?
      description: Optional. Include other approaches already used or considered.
