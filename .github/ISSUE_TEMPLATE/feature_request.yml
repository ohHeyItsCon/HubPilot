name: Feature request
description: Suggest a HubPilot improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the actual use case first.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe what HubPilot should do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other approaches tried
      description: Optional. Include anything already used or considered.
